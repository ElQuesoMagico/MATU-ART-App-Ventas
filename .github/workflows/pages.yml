name: Publicar MATU ART en GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Ruta de GitHub Pages
        env:
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          repo="${REPOSITORY#*/}"
          if [ "${repo,,}" = "${OWNER,,}.github.io" ]; then
            echo 'MATU_BASE_PATH=/' >> "$GITHUB_ENV"
          else
            echo "MATU_BASE_PATH=/$repo/" >> "$GITHUB_ENV"
          fi
      - name: Compilar aplicación local
        # Deliberately no cross-site cookie API: deployment decision still pending.
        env:
          VITE_CLOUD_API_URL: ''
        run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
